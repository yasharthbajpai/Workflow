services:
  - type: web
    name: nortex-travel-expense-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash render_start.sh
    envVars:
      - key: DATABASE_URL
        sync: false # provided by your Render Postgres instance
      - key: DB_SCHEMA
        value: Sample_test
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "720"
      - key: DEMO_PASSWORD
        value: Nortex@123
      - key: RESET_DEMO_DATA
        value: "1"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        sync: false # e.g. anthropic.claude-3-5-sonnet-20241022-v2:0
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://nortex-expense.vercel.app
